<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Srinivasa Cool Corner</title>
<style>
:root{--paper:#FFF8E7;--ink:#2B1B12;--muted:#7a6656;--turmeric:#F2B01E;--chili:#C8321E;--chutney:#2F6B3A;--line:#e6d9b8;--card:#fffdf6}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
body.chef{background:#17261b;color:#f1ecd8;--line:#2f4a36;--card:#1f3324;--muted:#a9bfa9}
header.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px;background:var(--brandbg,var(--ink));color:var(--paper);border-bottom:6px solid var(--turmeric)}
body.chef header.bar{background:#0e1a11;border-bottom-color:var(--chutney)}
header.bar h1{margin:0;font-size:1.25rem}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.95rem}
.mode{font-size:.75rem;border:1px solid currentColor;border-radius:99px;padding:2px 8px}
main{max-width:980px;margin:0 auto;padding:20px}
button{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:9px 16px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
.primary{background:var(--chili);border-color:var(--chili);color:#fff}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:inherit;border-color:currentColor}
.danger{background:#fff;border-color:var(--chili);color:var(--chili)}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:18px}
.center{max-width:380px;margin:9vh auto}
.center h2{margin-top:0}
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=date]{width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
.err{color:var(--chili);min-height:1.2em;font-weight:700}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.roles a{display:block;padding:22px 12px;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;border:3px solid var(--ink);color:var(--ink);background:var(--turmeric)}
.roles a.c{background:var(--chutney);color:#fff;border-color:#17261b}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
@media(max-width:760px){.grid,.roles{grid-template-columns:1fr}}
.dd{margin-bottom:14px}
.dd>button{width:100%;display:flex;justify-content:space-between;text-align:left}
.dd .list{display:none;border:2px solid var(--ink);border-top:0;border-radius:0 0 8px 8px;background:#fff}
.dd.open .list{display:block}
.dd.open>button{border-radius:8px 8px 0 0}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.item small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;padding:0;font-size:1.1rem}
.qty span{min-width:22px;text-align:center;font-weight:700}
.sub{min-width:64px;text-align:right;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 4px;text-align:left;border-bottom:1px dashed var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.total{display:flex;justify-content:space-between;font-size:1.25rem;font-weight:800;margin-top:12px;padding-top:10px;border-top:2px solid var(--ink)}
.empty{color:var(--muted);padding:12px 0}
.seg{display:flex;gap:8px}.seg button{flex:1}.seg button.on{background:var(--ink);color:var(--paper)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--line);color:var(--ink)}
.badge.cancelled{background:#f6d4cf;color:#8a1c0e}.badge.done{background:#d9eed6;color:#1d5a2a}.badge.new{background:#fde9b0;color:#6b4700}.badge.upi{background:#e4dcf5;color:#3d2a73}
.receipt{font-family:"Courier New",monospace;background:#fff;border:2px dashed var(--ink);padding:18px;margin-top:14px;color:var(--ink)}
.receipt h3{text-align:center;margin:0}
.oid{text-align:center;font-size:1.6rem;font-weight:800;letter-spacing:1px;background:var(--turmeric);padding:8px;margin:10px 0;border-radius:6px}
.ok{background:#e3f3e0;color:#1d5a2a;border:2px solid #2f6b3a;padding:10px;border-radius:8px;font-weight:700;margin-bottom:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ticket{border-left:8px solid var(--turmeric)}
.ticket h3{margin:0 0 4px;font-size:1.2rem}
.ticket .t{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.ticket li{font-size:1.05rem;padding:3px 0}
.ticket ul{padding-left:18px;margin:8px 0}
.ticket .amt{display:flex;justify-content:space-between;font-weight:800;border-top:1px solid var(--line);padding-top:8px;margin-bottom:10px}
.ticket button{width:100%;background:var(--chutney);border-color:var(--chutney);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab.on{background:var(--ink);color:var(--paper)}
.dhead{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.dhead h2{margin:0}
.dpick{display:flex;gap:8px;align-items:center}
.dpick input{width:auto}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:130px;border:2px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff}
.stat b{display:block;font-size:1.5rem}
.wrap{overflow-x:auto}
.chart text{fill:var(--ink);font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
.tops div{background:#fff;border:2px solid var(--line);border-radius:8px;padding:8px 10px}
dialog{border:3px solid var(--ink);border-radius:12px;max-width:560px;width:calc(100% - 24px);max-height:92vh;padding:18px;background:var(--paper);color:var(--ink)}
dialog section{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
dialog h3{margin:0 0 6px}
.log{font-size:.88rem;max-height:170px;overflow:auto;padding-left:16px;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-bottom:20px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;color:var(--muted);font-size:.8rem;font-weight:700;padding:2px 0}
.cal button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;min-height:50px;border-width:1px;font-weight:600;background:#fff}
.cal button small{font-size:.66rem;font-weight:700;min-height:.9em}
.cal button.has{background:#fde9b0}
.cal button.today{outline:2px solid var(--chili);outline-offset:-2px}
.cal button.sel{background:var(--ink);color:var(--paper)}
.cal button:disabled{opacity:.35;cursor:default}
.chart{max-width:720px}
.dpick select{padding:9px;border:2px solid var(--ink);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
.hidden{display:none!important}
@media print{header.bar,.noprint{display:none}.receipt{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
/* ============ SHOP SETTINGS: to reuse this app for another shop, edit BRAND, MENU and CLOUD ============ */
const BRAND = {
  name: "Srinivasa Cool Corner",
  nameLocal: "ಶ್ರೀನಿವಾಸ ಕೂಲ್ ಕಾರ್ನರ್",
  prefix: "SCC",                              // order IDs look like SCC-20261017-001; also keeps each shop's saved data separate
  emailDomain: "@srinivasacoolcorner.app",    // must match the two Firebase users below
  theme: { brand: "#B3122F", accent: "#F2B01E" } // header/buttons colour, highlight colour
};
document.title = BRAND.name;
const rs = document.documentElement.style;
rs.setProperty("--chili", BRAND.theme.brand); rs.setProperty("--brandbg", BRAND.theme.brand); rs.setProperty("--turmeric", BRAND.theme.accent);

/* ============ CLOUD SETUP (optional, one time) ============
   Leave both values empty to run in Demo mode (data stays in this browser only).
   To share orders between the counter and the kitchen on different devices:
   1) Create a Firebase project and a Realtime Database.
   2) Authentication > Sign-in method > enable Email/Password, then add two users:
      admin@srinivasacoolcorner.app and chef@srinivasacoolcorner.app, each with a strong password.
   3) Realtime Database > Rules, paste:
   { "rules": {
       "orders": { ".read": "auth != null",
         "$id": { ".write": "auth.token.email == 'admin@srinivasacoolcorner.app'",
                  "status": { ".write": "auth != null", ".validate": "newData.isString()" } } },
       "proofs": { ".read": "auth.token.email == 'admin@srinivasacoolcorner.app'",
                   ".write": "auth.token.email == 'admin@srinivasacoolcorner.app'" } } }
   4) Paste the database URL and the Web API key (Project settings) below.            */
const CLOUD = { databaseURL: "", apiKey: "" };
const CLOUD_ON = !!(CLOUD.databaseURL && CLOUD.apiKey);
const DOMAIN = BRAND.emailDomain;
const DEMO_HASH = { admin: "3ce0d6e8c31da56aa5888c1b43d0fbadfb63f2b4d072961aa5235fc3dccb16d2", chef: "dd829de2c3c7069fb2516442abfa3a24c0c9ecd3bed288afbadc640b2858d374" }; // demo mode only: SHA-256 of "vs:"+password

const MENU = [
  { category: "Chats", items: [
    { id: "bhel", name: "Bhel Puri", price: 50 },
    { id: "masala", name: "Masala Puri", price: 40 } ] },
  { category: "Sandwiches", items: [
    { id: "cheese", name: "Cheese Sandwich", price: 80 },
    { id: "choco", name: "Choco Sandwich", price: 70 } ] }
];
const allItems = MENU.flatMap(c => c.items);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const inr = n => "₹" + n.toLocaleString("en-IN");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const p2 = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate());
const iso = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const REF = /^[A-Za-z0-9]{10,22}$/;
const LABEL = { new: "In queue", done: "Prepared", cancelled: "Cancelled" };
const norm = o => ({ refunds: [], log: [], pay: { mode: "cash", ref: "", photo: false }, paid: o.total, ...o });
const net = o => o.paid - o.refunds.reduce((s, r) => s + r.amount, 0);
const D = a => a.map(l => l.qty + "× " + l.name).join(", ");

/* ---------- session & login safety ---------- */
let S = JSON.parse(sessionStorage.getItem("vs") || "null");
const saveS = () => sessionStorage.setItem("vs", JSON.stringify(S));
let idle;
const bump = () => { clearTimeout(idle); if (S && S.role === "admin") idle = setTimeout(() => logout("Signed out after 15 minutes without activity."), 9e5); };
["click", "keydown", "touchstart"].forEach(e => addEventListener(e, bump, { passive: true }));
function logout(note) {
  clearTimeout(idle); S = null; sessionStorage.removeItem("vs");
  if (note) sessionStorage.setItem("vsNote", note);
  const same = location.hash === "#/"; location.hash = "#/"; if (same) route();
}
const lockLeft = () => Math.max(0, Math.ceil(((+localStorage.vsLock || 0) - Date.now()) / 1000));
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("vs:" + s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function signIn(role, user, pass) {
  if (user.toLowerCase() !== role) return null; // username must match the screen's role
  if (CLOUD_ON) {
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${CLOUD.apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: role + DOMAIN, password: pass, returnSecureToken: true }) });
    const j = await r.json(); if (!r.ok) return null;
    return { idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + +j.expiresIn * 1000 };
  }
  return (await sha(pass)) === DEMO_HASH[role] ? {} : null;
}
async function changePw() {
  const p = prompt("New password (at least 8 characters):"); if (!p) return;
  if (p.length < 8) return alert("That password is too short.");
  try {
    const t = await api.token();
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${CLOUD.apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ idToken: t, password: p, returnSecureToken: true }) });
    const j = await r.json(); if (!r.ok) throw 0;
    Object.assign(S, { idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + +j.expiresIn * 1000 }); saveS(); alert("Password changed.");
  } catch { alert("Could not change the password. Sign in again, then retry."); }
}

/* ---------- storage: cloud (Firebase REST) or demo (localStorage) ---------- */
const api = {
  async token() {
    if (Date.now() > S.exp - 60000) {
      const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${CLOUD.apiKey}`, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `grant_type=refresh_token&refresh_token=${S.refreshToken}` });
      const j = await r.json(); if (!r.ok) { logout("Session expired. Please sign in again."); throw new Error("expired"); }
      Object.assign(S, { idToken: j.id_token, refreshToken: j.refresh_token, exp: Date.now() + +j.expires_in * 1000 }); saveS();
    }
    return S.idToken;
  },
  async call(path, method = "GET", body, qs = "") {
    const t = await this.token();
    const r = await fetch(`${CLOUD.databaseURL.replace(/\/$/, "")}/${path}.json?auth=${t}${qs}`, { method, body: body === undefined ? undefined : JSON.stringify(body) });
    if (!r.ok) throw new Error("Cloud error " + r.status);
    return r.json();
  }
};
const LK = BRAND.prefix + "_orders", PK = BRAND.prefix + "_proofs";
const lj = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
const store = CLOUD_ON ? {
  async orders(since) { const q = since ? `&orderBy=${encodeURIComponent('"$key"')}&startAt=${encodeURIComponent('"' + BRAND.prefix + '-' + since + '"')}` : ""; return Object.values(await api.call("orders", "GET", undefined, q) || {}); },
  get: id => api.call("orders/" + id),
  put: o => api.call("orders/" + o.id, "PUT", o),
  patch: (id, f) => api.call("orders/" + id, "PATCH", f),
  setStatus: (id, s) => api.call(`orders/${id}/status`, "PUT", s),
  putProof: (id, d) => api.call("proofs/" + id, "PUT", d),
  getProof: id => api.call("proofs/" + id)
} : {
  async orders(since) { return Object.values(lj(LK)).filter(o => !since || o.id >= BRAND.prefix + "-" + since); },
  async get(id) { return lj(LK)[id] || null; },
  async put(o) { const a = lj(LK); a[o.id] = o; localStorage.setItem(LK, JSON.stringify(a)); },
  async patch(id, f) { const a = lj(LK); a[id] = { ...a[id], ...f }; localStorage.setItem(LK, JSON.stringify(a)); },
  async setStatus(id, s) { return this.patch(id, { status: s }); },
  async putProof(id, d) { const a = lj(PK); a[id] = d; localStorage.setItem(PK, JSON.stringify(a)); },
  async getProof(id) { return lj(PK)[id] || null; }
};
async function newId() {
  const d = ymd(new Date()); let n = (await store.orders(d)).filter(o => o.id.startsWith(BRAND.prefix + "-" + d)).length + 1;
  for (;;) { const id = `${BRAND.prefix}-${d}-${String(n).padStart(3, "0")}`; if (!(await store.get(id))) return id; n++; }
}
const compress = f => new Promise((res, rej) => {
  const im = new Image(), u = URL.createObjectURL(f);
  im.onload = () => { const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", .6)); };
  im.onerror = rej; im.src = u;
});

/* ---------- router, header, clock ---------- */
const app = $("#app");
let timer = null;
const hdr = (t, btns = "") => `<header class="bar"><h1>${t}</h1><span class="clock"></span><span class="mode" title="${CLOUD_ON ? "Shared cloud database" : "Orders stay in this browser only"}">${CLOUD_ON ? "Cloud" : "Demo mode"}</span>${btns}</header>`;
const fmtNow = () => new Date().toLocaleString("en-IN", { weekday: "short", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const tick = () => document.querySelectorAll(".clock").forEach(c => c.textContent = fmtNow());
setInterval(tick, 1000);
function route() {
  clearInterval(timer); document.body.className = "";
  const h = location.hash.replace("#/", "");
  if (h === "admin" && S && S.role === "admin") return adminView();
  if (h === "chef" && S && S.role === "chef") return chefView();
  if (h === "admin-login" || h === "chef-login") return loginView(h.split("-")[0]);
  home();
}
addEventListener("hashchange", () => { route(); tick(); });

function home() {
  const note = sessionStorage.getItem("vsNote"); sessionStorage.removeItem("vsNote");
  app.innerHTML = hdr(BRAND.name) + `<main><div class="card center"><h2 style="margin-bottom:2px">${esc(BRAND.name)}</h2><p style="margin:0 0 6px;color:var(--muted)">${BRAND.nameLocal}</p><h3 style="margin:14px 0 0">Who is signing in?</h3>${note ? `<p class="err">${esc(note)}</p>` : ""}
  <div class="roles"><a href="#/admin-login">Admin<br><small>Billing</small></a><a class="c" href="#/chef-login">Chef<br><small>Order queue</small></a></div></div></main>`;
}

function loginView(r) {
  if (r === "chef") document.body.className = "chef";
  const name = r === "admin" ? "Admin" : "Chef";
  app.innerHTML = hdr(`${BRAND.name} – ${name} Login`, '<a href="#/" style="color:inherit">Back</a>') + `<main><form class="card center" id="f"><h2>${name} sign in</h2>
  <label for="u">Username</label><input type="text" id="u" autocomplete="username" required>
  <label for="p">Password</label><input type="password" id="p" autocomplete="current-password" required>
  ${r === "admin" ? '<label for="n">Your name (saved on every edit and refund)</label><input type="text" id="n" maxlength="40" autocomplete="name" required>' : ""}
  <p class="err" id="e" role="alert"></p><button class="primary" style="width:100%">Sign in</button></form></main>`;
  $("#f").onsubmit = async e => {
    e.preventDefault(); const er = $("#e"), left = lockLeft();
    if (left) return er.textContent = `Too many attempts. Try again in ${left} seconds.`;
    if (r === "admin" && $("#n").value.trim().length < 2) { $("#n").focus(); return er.textContent = "Enter your name (at least 2 letters). It is saved on every order you handle."; }
    er.textContent = "Signing in…";
    try {
      const t = await signIn(r, $("#u").value.trim(), $("#p").value);
      if (!t) { const f = (+localStorage.vsFail || 0) + 1; localStorage.vsFail = f;
        if (f >= 5) { localStorage.vsLock = Date.now() + 30000; localStorage.vsFail = 0; return er.textContent = "Too many attempts. Locked for 30 seconds."; }
        return er.textContent = "Wrong username or password. Try again."; }
      localStorage.vsFail = 0;
      S = { role: r, name: r === "admin" ? $("#n").value.trim() : "chef", ...t }; saveS(); bump(); location.hash = "#/" + r;
    } catch { er.textContent = "Could not sign in. Check the internet connection."; }
  };
  $("#u").focus();
}

/* ---------- Admin ---------- */
function adminView() {
  bump();
  const cart = {}; let mode = null, photo = null, dashDate = iso(new Date());
  app.innerHTML = hdr(BRAND.name + " - Billing", `${CLOUD_ON ? '<button class="ghost" id="pw">Change password</button>' : ""}<button class="ghost" id="lo">Log out</button>`) + `
  <main><div class="tabs"><button class="tab on" id="tNew">New order</button><button class="tab" id="tDash">Dashboard</button></div>
  <div id="paneNew"><div id="msg"></div><div class="grid" id="formView">
  <section class="card"><h2 style="margin-top:0">New order</h2><div id="dds"></div></section>
  <section class="card"><h2 style="margin-top:0">Summary</h2><div id="sum"></div>
    <h3 style="margin-bottom:8px">Payment</h3>
    <div class="seg"><button type="button" data-m="cash">Cash</button><button type="button" data-m="upi">UPI</button></div>
    <div id="upi" class="hidden"><label for="ref">UPI reference number</label><input type="text" id="ref" autocomplete="off" placeholder="12-digit UPI Ref / UTR">
    <label for="ph">Or attach a photo of the payment</label><input type="file" id="ph" accept="image/*" capture="environment"><div id="pv"></div></div>
    <p class="err" id="perr" role="alert"></p>
    <button class="primary" id="place" style="width:100%">Place Order &amp; Generate Bill</button></section>
  </div><div id="bill"></div></div><div id="paneDash" class="hidden"></div></main>`;
  $("#lo").onclick = () => logout();
  if ($("#pw")) $("#pw").onclick = changePw;

  const dashSet = d => { dashDate = d; paintDash($("#paneDash"), dashDate, dashSet); };
  const dashDraw = (quiet) => renderDash($("#paneDash"), dashDate, dashSet, quiet === true);
  const show = t => {
    $("#paneNew").classList.toggle("hidden", t !== "new"); $("#paneDash").classList.toggle("hidden", t !== "dash");
    $("#tNew").classList.toggle("on", t === "new"); $("#tDash").classList.toggle("on", t === "dash");
    if (t === "dash") dashDraw();
  };

      <div class="sub">–</div></div>`).join("")}</div></div>`).join("");
  dds.addEventListener("click", e => {
    const top = e.target.closest(".dd > button");

    $("#sum").innerHTML = ls.length

    try { photo = await compress(f); $("#pv").innerHTML = `<img src="${photo}" alt="Payment photo" style="max-width:140px;border-radius:8px;margin-top:6px">`; } catch { $("#perr").textContent = "Could not read that image. Try another photo."; } };

      if (photo) await store.putProof(id, photo);

/* ---------- Dashboard ---------- */
const PERIODS = [["Morning", "5 am – 12 pm"], ["Afternoon", "12 – 5 pm"], ["Evening", "5 – 9 pm"], ["Night", "9 pm – 5 am"]];

let dashAll = [], calYM = null, exScope = "day";
const short = n => n >= 1000 ? "₹" + (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : "₹" + n;
const tile = (l, v) => `<div class="stat">${l}<b>${v}</b></div>`;

async function renderDash(el, date, setDate, quiet) {
  if (!quiet) el.innerHTML = '<p class="empty">Loading…</p>';
  try { dashAll = (await store.orders()).map(norm); }
  catch { if (!quiet) el.innerHTML = '<div class="card"><p class="err">Could not load orders. Check the connection and reopen this tab.</p></div>'; return; }
  paintDash(el, date, setDate);
}

function paintDash(el, date, setDate) {
  const all = dashAll, today = iso(new Date()), dk = o => iso(new Date(o.time));
  if (!calYM) calYM = date.slice(0, 7);
  const agg = {};
  all.forEach(o => { const a = agg[dk(o)] = agg[dk(o)] || { n: 0, amt: 0 }; if (o.status !== "cancelled") a.n++; a.amt += net(o); });
  const sum = a => a.reduce((s, o) => s + net(o), 0), mode = (a, m) => sum(a.filter(o => o.pay.mode === m));
  const tAll = all.filter(o => dk(o) === today), tLive = tAll.filter(o => o.status !== "cancelled");
  const day = all.filter(o => dk(o) === date).sort((a, b) => a.time < b.time ? -1 : 1), live = day.filter(o => o.status !== "cancelled");
  const longToday = new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const title = date === today ? "Orders placed today" : "Orders placed on " + new Date(date + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
  const [cy, cm] = calYM.split("-").map(Number), first = new Date(cy, cm - 1, 1), lead = (first.getDay() + 6) % 7, dim = new Date(cy, cm, 0).getDate();
  let cells = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(w => `<div class="wd">${w}</div>`).join("") + "<span></span>".repeat(lead);
  for (let d = 1; d <= dim; d++) { const k = `${cy}-${p2(cm)}-${p2(d)}`, a = agg[k];
    cells += `<button type="button" data-d="${k}" class="${a && a.n ? "has" : ""} ${k === date ? "sel" : ""} ${k === today ? "today" : ""}" ${k > today ? "disabled" : ""} aria-label="${k}${a && a.n ? ", " + a.n + " orders" : ""}"><span>${d}</span><small>${a && a.amt ? short(a.amt) : ""}</small></button>`; }
  el.innerHTML = `
  <div class="card" style="margin-bottom:20px"><div class="dhead"><h2>Today · ${longToday}</h2><button class="primary" type="button" id="goNew">Place new order</button></div>
    <div class="stats" style="margin:0">${tile("Orders placed", tLive.length)}${tile("Amount received", inr(sum(tAll)))}${tile("Cash", inr(mode(tAll, "cash")))}${tile("UPI", inr(mode(tAll, "upi")))}
    ${tile("Refunded", inr(tAll.reduce((s, o) => s + o.paid - net(o), 0)))}${tile("Waiting in kitchen", tAll.filter(o => o.status === "new").length)}</div></div>
  <div class="grid2">
    <div class="card"><div class="dhead" style="margin-bottom:10px"><button type="button" id="cprev" aria-label="Previous month" style="padding:4px 12px">‹</button><h2 style="font-size:1.1rem">${first.toLocaleDateString("en-IN", { month: "long", year: "numeric" })}</h2><button type="button" id="cnext" aria-label="Next month" style="padding:4px 12px" ${calYM >= today.slice(0, 7) ? "disabled" : ""}>›</button></div>
      <div class="cal">${cells}</div><p style="margin:8px 0 0;color:var(--muted);font-size:.85rem">Tap a day to see its orders. Yellow days have orders; the amount received is shown under each date.</p></div>
    <div class="card"><h2 style="margin-top:0">${date === today ? "Today's orders" : new Date(date + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" })}</h2>
      ${date === today ? '<p class="empty" style="margin:0">Pick another date on the calendar to see an earlier day.</p>'
        : `<div class="stats">${tile("Orders", live.length)}${tile("Received", inr(sum(day)))}${tile("Cash", inr(mode(day, "cash")))}${tile("UPI", inr(mode(day, "upi")))}</div><button type="button" id="dToday">Back to today</button>`}</div>
  </div>
  <div class="card" style="margin-bottom:20px"><div class="dhead"><h2>${title}</h2><div class="dpick"><label for="xs" style="margin:0">Download records</label>
      <select id="xs"><option value="day" ${exScope === "day" ? "selected" : ""}>This day</option><option value="month" ${exScope === "month" ? "selected" : ""}>${first.toLocaleDateString("en-IN", { month: "long", year: "numeric" })}</option><option value="all" ${exScope === "all" ? "selected" : ""}>All records</option></select>
      <button type="button" id="xx">Excel</button><button type="button" id="xp">PDF</button></div></div>
    ${day.length ? `<div class="wrap"><table><thead><tr><th>Order ID</th><th>Time</th><th>Items</th><th>Payment</th><th>Status</th><th class="r">Total received</th><th></th></tr></thead><tbody>
      ${day.map(o => `<tr><td>${esc(o.id)}</td><td>${new Date(o.time).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" })}</td><td>${esc(D(o.items))}</td>
      <td><span class="badge ${o.pay.mode === "upi" ? "upi" : ""}">${o.pay.mode === "upi" ? "UPI" : "Cash"}</span></td>
      <td><span class="badge ${o.status}">${LABEL[o.status]}</span>${o.paid - net(o) ? `<br><small>Refunded ${inr(o.paid - net(o))}</small>` : ""}</td>
      <td class="r">${inr(net(o))}</td><td><button type="button" data-m="${esc(o.id)}" style="padding:4px 10px">Manage</button></td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="5">Total received</td><td class="r">${inr(sum(day))}</td><td></td></tr></tfoot></table></div>` : `<p class="empty">No orders on this date.</p>`}</div>
  <div class="card" style="margin-bottom:20px"><h2 style="margin-top:0">Amount received, last 7 days</h2>${revChart(agg)}</div>
  <div class="card"><h2 style="margin-top:0">What sells at each time of day</h2>${timeChart(all.filter(o => o.status !== "cancelled"))}</div>`;
  el.querySelectorAll(".cal button[data-d]").forEach(b => b.onclick = () => setDate(b.dataset.d));
  const shift = n => { const d = new Date(cy, cm - 1 + n, 1); calYM = d.getFullYear() + "-" + p2(d.getMonth() + 1); paintDash(el, date, setDate); };
  $("#cprev", el).onclick = () => shift(-1); $("#cnext", el).onclick = () => shift(1);
  if ($("#dToday", el)) $("#dToday", el).onclick = () => { calYM = null; setDate(today); };
  $("#goNew").onclick = () => $("#tNew").click();
  const longD = k => new Date(k + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
  $("#xs", el).onchange = e => exScope = e.target.value;
  const pick = () => exScope === "day" ? { list: day, label: longD(date), tag: date }
    : exScope === "month" ? { list: all.filter(o => dk(o).slice(0, 7) === calYM), label: first.toLocaleDateString("en-IN", { month: "long", year: "numeric" }), tag: calYM }
    : { list: all, label: "All records", tag: "all-" + today };
  $("#xx", el).onclick = () => exportRecords(pick(), "csv"); $("#xp", el).onclick = () => exportRecords(pick(), "pdf");
  el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => manage(b.dataset.m, () => renderDash(el, date, setDate)));
}

function revChart(agg) {
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d; });
  const vals = days.map(d => (agg[iso(d)] || { amt: 0 }).amt), cnt = days.map(d => (agg[iso(d)] || { n: 0 }).n);
  const nice = m => { const p = 10 ** Math.floor(Math.log10(m)); for (const f of [1, 2, 5, 10]) if (m <= f * p) return f * p; return 10 * p; };
  const top = nice(Math.max(...vals, 100)), W = 600, H = 270, L = 48, T = 18, B = 48, slot = (W - L - 8) / 7, bw = slot * .6, ch = H - T - B;
  let g = "";
  for (let k = 0; k <= 4; k++) { const y = T + ch - ch * k / 4; g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#e6d9b8"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11">${short(Math.round(top * k / 4))}</text>`; }
  days.forEach((d, i) => { const v = vals[i], h = v / top * ch, x = L + i * slot + (slot - bw) / 2, y = T + ch - h, last = i === 6, cx = x + bw / 2;
    g += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${last ? BRAND.theme.brand : BRAND.theme.accent}"><title>${d.toLocaleDateString("en-IN", { day: "numeric", month: "short" })}: ${inr(v)}, ${cnt[i]} orders</title></rect>`;
    if (v) g += `<text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="700">${short(v)}</text>`;
    g += `<text x="${cx}" y="${H - 28}" text-anchor="middle" font-size="12" font-weight="700">${last ? "Today" : d.toLocaleDateString("en-IN", { weekday: "short" }) + " " + d.getDate()}</text><text x="${cx}" y="${H - 13}" text-anchor="middle" font-size="11">${cnt[i]} order${cnt[i] === 1 ? "" : "s"}</text>`; });
  const tot = vals.reduce((a, b) => a + b, 0), n = cnt.reduce((a, b) => a + b, 0);
  return `<p style="margin:0 0 6px;color:var(--muted)">Last 7 days: <b style="color:var(--ink)">${inr(tot)}</b> from ${n} order${n === 1 ? "" : "s"}. Today is in red.</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Amount received per day for the last 7 days" style="width:100%;height:auto">${g}</svg>`;
}

function timeChart(orders) {
  if (!orders.length) return `<p class="empty">The chart appears after the first order.</p>`;
  const items = allItems, data = PERIODS.map(() => items.map(() => 0));
  orders.forEach(o => { const p = periodOf(new Date(o.time).getHours()); o.items.forEach(l => { const i = items.findIndex(x => x.name === l.name); if (i >= 0) data[p][i] += l.qty; }); });
  const step = Math.max(1, Math.ceil(Math.max(...data.flat()) / 4)), top = step * 4;
  const W = 600, H = 290, L = 36, T = 16, B = 52, gw = (W - L - 8) / 4, bw = gw * 0.8 / items.length, ch = H - T - B;
  let g = "";
  for (let k = 0; k <= 4; k++) { const y = T + ch - ch * k / 4; g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#e6d9b8"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11">${step * k}</text>`; }
  PERIODS.forEach((p, pi) => {
    items.forEach((it, i) => { const v = data[pi][i], h = v / top * ch, x = L + pi * gw + gw * 0.1 + i * bw, y = T + ch - h;
      g += `<rect x="${x}" y="${y}" width="${bw - 3}" height="${h}" rx="2" fill="${COLORS[i % COLORS.length]}"><title>${esc(it.name)}: ${v}</title></rect>`;
      if (v) g += `<text x="${x + (bw - 3) / 2}" y="${y - 4}" text-anchor="middle" font-size="11" font-weight="700">${v}</text>`; });
    g += `<text x="${L + pi * gw + gw / 2}" y="${H - 28}" text-anchor="middle" font-size="13" font-weight="700">${p[0]}</text><text x="${L + pi * gw + gw / 2}" y="${H - 12}" text-anchor="middle" font-size="11">${p[1]}</text>`;
  });
  const legend = items.map((it, i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${esc(it.name)}</span>`).join("");
  const tops = PERIODS.map((p, pi) => { const m = Math.max(...data[pi]); return `<div><b>${p[0]}</b><br>${m ? esc(items[data[pi].indexOf(m)].name) + " (" + m + ")" : "No orders yet"}</div>`; }).join("");
  return `<p style="margin:0;color:var(--muted)">Quantity sold per item, all orders (cancelled orders excluded).</p><div class="legend">${legend}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Items sold by time of day" style="width:100%;height:auto">${g}</svg><div class="tops">${tops}</div>`;
}

/* ---------- Edit / refund / cancel with audit record ---------- */
async function manage(id, done) {
  const dlg = $("#dlg"); let o;
  try { o = norm(await store.get(id)); } catch { return alert("Could not load the order."); }
  const q = {}; o.items.forEach(l => q[l.name] = l.qty);
  const rem = net(o), canEdit = o.status === "new", canRefund = o.status !== "cancelled" && rem > 0;
  dlg.innerHTML = `<h2 style="margin-top:0">${esc(o.id)} <span class="badge ${o.status}">${LABEL[o.status]}</span></h2>
  <div>Payment: <b>${o.pay.mode === "upi" ? "UPI" : "Cash"}</b>${o.pay.ref ? " · Ref " + esc(o.pay.ref) : ""} ${o.pay.photo ? '<button type="button" id="vp" style="padding:3px 10px">View photo</button>' : ""}</div><div id="pimg"></div>
  <div>Collected ${inr(o.paid)} · Refunded ${inr(o.paid - rem)} · <b>Net ${inr(rem)}</b></div>
  ${canEdit ? `<section><h3>Edit items</h3>${o.items.map(l => `<div class="item" data-n="${esc(l.name)}"><div>${esc(l.name)}<small>${inr(l.price)} each</small></div><div class="qty"><button type="button" data-d="-1">−</button><span>${l.qty}</span><button type="button" data-d="1">+</button></div></div>`).join("")}
    <p id="ediff"></p><button class="primary" id="esave">Save changes</button></section>`
    : `<section><p class="empty" style="margin:0">${o.status === "done" ? "Already prepared, so items can't be edited. Record a refund if needed." : "This order is cancelled."}</p></section>`}
  ${canRefund ? `<section><h3>Refund</h3><label for="ra">Amount (up to ${inr(rem)})</label><input type="number" id="ra" min="1" max="${rem}" value="${rem}">
    <label for="rr">Reason</label><input type="text" id="rr"><label for="rf">Refund reference (optional)</label><input type="text" id="rf"><div class="actions"><button id="rbtn">Record refund</button></div></section>` : ""}
  ${canEdit ? `<section><h3>Cancel order</h3><label for="cr">Reason</label><input type="text" id="cr"><div class="actions"><button class="danger" id="cbtn">Cancel order${rem ? " &amp; refund " + inr(rem) : ""}</button></div></section>` : ""}
  <section><h3>Record of changes</h3><ul class="log">${[...o.log].reverse().map(e => `<li>${new Date(e.at).toLocaleString("en-IN")} · <b>${esc(e.by)}</b> · ${esc(e.action)}${e.detail ? ": " + esc(e.detail) : ""}</li>`).join("")}</ul></section>
  <p class="err" id="derr" role="alert"></p><div class="actions"><button id="dc">Close</button></div>`;
  dlg.showModal();
  const err = m => $("#derr", dlg).textContent = m, E = (action, detail = "") => ({ at: new Date().toISOString(), by: S.name, action, detail });
  const fresh = async need => { const c = norm(await store.get(id)); if (need && c.status !== need) { err("This order changed in the meantime. Close and reopen it."); return null; } return c; };
  const fin = () => { dlg.close(); done(); }, fail = () => err("Could not save. Check the connection and try again.");
  $("#dc", dlg).onclick = () => dlg.close();
  if ($("#vp", dlg)) $("#vp", dlg).onclick = async () => { const p = await store.getProof(id); $("#pimg", dlg).innerHTML = p ? `<img src="${p}" alt="Payment photo" style="max-width:100%;margin-top:8px;border-radius:8px">` : "Photo not found."; };
  const upd = () => { dlg.querySelectorAll(".item").forEach(r => $("span", r).textContent = q[r.dataset.n]);
    const t = o.items.reduce((s, l) => s + l.price * q[l.name], 0), d = t - o.paid;
    $("#ediff", dlg).textContent = d > 0 ? `New total ${inr(t)}. Collect ${inr(d)} more from the customer.` : d < 0 ? `New total ${inr(t)}. Give ${inr(-d)} back to the customer (saved as a refund).` : `New total ${inr(t)}.`; };
  dlg.onclick = e => { const b = e.target.closest(".qty button"); if (b && canEdit) { const n = b.closest(".item").dataset.n; q[n] = Math.max(0, q[n] + +b.dataset.d); upd(); } };
  if (canEdit) {
    upd();
    $("#esave", dlg).onclick = async () => { try {
      const c = await fresh("new"); if (!c) return;
      const items = c.items.map(l => ({ ...l, qty: q[l.name] ?? l.qty, total: l.price * (q[l.name] ?? l.qty) })).filter(l => l.qty > 0);
      if (!items.length) return err("All items removed. Use Cancel order instead.");
      const total = items.reduce((s, l) => s + l.total, 0), diff = total - c.paid; let paid = c.paid, refunds = c.refunds;
      const log = [...c.log, E("Edited items", `${D(c.items)} → ${D(items)}`)];
      if (diff > 0) { paid = total; log.push(E("Extra collected", `${inr(diff)} by ${c.pay.mode.toUpperCase()}`)); }
      if (diff < 0) { refunds = [...refunds, { amount: -diff, reason: "Order edited", ref: "", by: S.name, at: new Date().toISOString() }]; log.push(E("Refund", `${inr(-diff)} given back (order edited)`)); }
      await store.patch(id, { items, total, paid, refunds, log, edited: true }); fin();
    } catch { fail(); } };
    $("#cbtn", dlg).onclick = async () => { const why = $("#cr", dlg).value.trim(); if (!why) return err("Enter a reason for cancelling.");
      try { const c = await fresh("new"); if (!c) return; const r = net(c); const now = new Date().toISOString();
        await store.patch(id, { status: "cancelled", refunds: r ? [...c.refunds, { amount: r, reason: "Order cancelled: " + why, ref: "", by: S.name, at: now }] : c.refunds,
          log: [...c.log, E("Cancelled", why + (r ? ` · ${inr(r)} refunded` : ""))] }); fin();
      } catch { fail(); } };
  }
  if (canRefund) $("#rbtn", dlg).onclick = async () => {
    const amt = +$("#ra", dlg).value, why = $("#rr", dlg).value.trim(), ref = $("#rf", dlg).value.trim();
    if (!(amt > 0) || amt > rem) return err(`Enter an amount between ₹1 and ${inr(rem)}.`);
    if (!why) return err("Enter a reason for the refund.");
    try { const c = await fresh(); if (net(c) < amt) return err("Less is left to refund now. Close and reopen the order.");
      await store.patch(id, { refunds: [...c.refunds, { amount: amt, reason: why, ref, by: S.name, at: new Date().toISOString() }], log: [...c.log, E("Refund", `${inr(amt)} · ${why}${ref ? " (ref " + ref + ")" : ""}`)] }); fin();
    } catch { fail(); } };
}

/* ---------- Export: Excel (CSV) and PDF ---------- */
async function saveFile(name, blob) {
  try { const dl = window.claude && await window.claude.use("downloads"); if (dl) { await dl.save({ filename: name, data: blob }); return; } }
  catch (e) { if (e && e.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const recordRows = list => [...list].sort((a, b) => a.time < b.time ? -1 : 1).map(o => { const d = new Date(o.time);
  return { id: o.id, date: iso(d), time: p2(d.getHours()) + ":" + p2(d.getMinutes()), items: D(o.items), total: o.total, mode: o.pay.mode === "upi" ? "UPI" : "Cash", ref: o.pay.ref || "",
    refunded: o.paid - net(o), net: net(o), status: LABEL[o.status], by: (o.log[0] || {}).by || "", changes: [...new Set(o.log.slice(1).map(e => e.by))].join("; "), live: o.status !== "cancelled" }; });

function exportRecords(sel, fmt) {
  const rows = recordRows(sel.list);
  if (!rows.length) return alert("There are no records for this selection.");
  const name = BRAND.prefix.toLowerCase() + "-orders-" + sel.tag, sum = k => rows.reduce((s, r) => s + r[k], 0), live = rows.filter(r => r.live).length;
  if (fmt === "pdf") return saveFile(name + ".pdf", makePDF(sel.label, rows));
  const q = v => { v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const head = ["Order ID", "Date", "Time", "Items", "Order Total (INR)", "Payment", "UPI Ref", "Refunded (INR)", "Net Received (INR)", "Status", "Processed By", "Changes By"];
  const body = rows.map(r => [r.id, r.date, r.time, r.items, r.total, r.mode, r.ref, r.refunded, r.net, r.status, r.by, r.changes]);
  const tot = ["TOTAL", "", "", live + " orders", "", "", "", sum("refunded"), sum("net"), "", "", ""];
  const csv = "\uFEFF" + [head, ...body, tot].map(r => r.map(q).join(",")).join("\r\n");
  return saveFile(name + ".csv", new Blob([csv], { type: "text/csv;charset=utf-8" }));
}

function makePDF(label, rows) {
  const A = s => String(s).replace(/₹/g, "Rs ").replace(/×/g, "x").replace(/[\u00a0\u202f]/g, " ").replace(/[^\x20-\x7E]/g, "?");
  const R = n => "Rs " + n.toLocaleString("en-IN"), pad = (s, n) => A(s).slice(0, n).padEnd(n), rp = (s, n) => A(s).slice(-n).padStart(n);
  const total = rows.reduce((s, r) => s + r.net, 0), cash = rows.filter(r => r.mode === "Cash").reduce((s, r) => s + r.net, 0), refunded = rows.reduce((s, r) => s + r.refunded, 0), live = rows.filter(r => r.live).length;
  const wrap = (t, n) => { const out = []; let cur = ""; t.split(", ").forEach(w => { const nx = cur ? cur + ", " + w : w; if (nx.length > n && cur) { out.push(cur + ","); cur = w; } else cur = nx; }); out.push(cur); return out; };
  const row = (a, b, c, d, e, f, g, h) => pad(a, 17) + " " + pad(b, 10) + " " + pad(c, 5) + " " + pad(d, 42) + " " + pad(e, 5) + " " + pad(f, 12) + " " + pad(g, 9) + " " + rp(h, 10);
  const Ls = [{ t: BRAND.name.toUpperCase(), b: 1, big: 1 }, { t: "Orders report: " + label }, { t: "Generated " + new Date().toLocaleString("en-IN") + " by " + S.name }, { t: "" },
    { t: `Orders ${live}   Received ${R(total)}   Cash ${R(cash)}   UPI ${R(total - cash)}   Refunded ${R(refunded)}`, b: 1 }, { t: "" },
    { t: row("Order ID", "Date", "Time", "Items", "Pay", "By", "Status", "Net (Rs)"), b: 1 }, { t: "-".repeat(117) }];
  rows.forEach(r => { const it = wrap(r.items, 42); it.forEach((x, i) => Ls.push({ t: i ? row("", "", "", x, "", "", "", "") : row(r.id, r.date, r.time, x, r.mode, r.by, r.status, r.net.toLocaleString("en-IN")) })); });
  Ls.push({ t: "-".repeat(117) }, { t: pad(`TOTAL (${live} orders)`, 106) + " " + rp(R(total), 10), b: 1 });
  const W = 842, H = 595, M = 36, FS = 8, LH = 10.5, per = Math.floor((H - 2 * M) / LH) - 1, pages = [];
  for (let i = 0; i < Ls.length; i += per) pages.push(Ls.slice(i, i + per));
  const E = s => A(s).replace(/[\\()]/g, "\\$&");
  const content = (pg, n) => { let c = "BT\n", y = H - M; pg.forEach(l => { c += `/${l.b ? "F2" : "F1"} ${l.big ? 13 : FS} Tf 1 0 0 1 ${M} ${y} Tm (${E(l.t)}) Tj\n`; y -= l.big ? 16 : LH; });
    return c + `/F1 7 Tf 1 0 0 1 ${W - M - 60} 18 Tm (Page ${n} of ${pages.length}) Tj\nET`; };
  const objs = ["<< /Type /Catalog /Pages 2 0 R >>", `<< /Type /Pages /Kids [${pages.map((_, i) => `${5 + i * 2} 0 R`).join(" ")}] /Count ${pages.length} >>`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>", "<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>"];
  pages.forEach((pg, i) => { const c = content(pg, i + 1);
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`, `<< /Length ${c.length} >>\nstream\n${c}\nendstream`); });
  let out = "%PDF-1.4\n"; const off = [];
  objs.forEach((o, i) => { off.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const x = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + off.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") + `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out], { type: "application/pdf" });
}

/* ---------- Chef ---------- */
function chefView() {
  document.body.className = "chef";
  app.innerHTML = hdr(BRAND.name + " - Order Queue", (CLOUD_ON ? '<button class="ghost" id="pw">Change password</button>' : "") + '<button class="ghost" id="lo">Log out</button>') + '<main><div id="q"></div><p class="err" id="ce"></p></main>';
  $("#lo").onclick = () => logout(); if ($("#pw")) $("#pw").onclick = changePw;
  const qEl = $("#q"); let last = "";
  async function draw() {
    try {
      const open = (await store.orders(ymd(new Date(Date.now() - 864e5)))).map(norm).filter(o => o.status === "new").sort((a, b) => a.time < b.time ? -1 : 1);
      $("#ce").textContent = ""; const sig = JSON.stringify(open.map(o => [o.id, o.total, o.items])); if (sig === last) return; last = sig;
      qEl.innerHTML = open.length ? `<div class="orders">${open.map(o => `<article class="card ticket"><h3>${esc(o.id)}</h3>
        <div class="t">${new Date(o.time).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" })} · <span class="badge ${o.pay.mode === "upi" ? "upi" : ""}">${o.pay.mode === "upi" ? "UPI paid" : "Cash received"}</span>${o.edited ? ' <span class="badge new">Updated</span>' : ""}</div>
        <ul>${o.items.map(l => `<li><b>${l.qty} ×</b> ${esc(l.name)}</li>`).join("")}</ul>
        <div class="amt"><span>Total</span><span>${inr(o.total)}</span></div><button data-id="${esc(o.id)}">Mark as done</button></article>`).join("")}</div>`
        : `<div class="card"><p class="empty" style="font-size:1.2rem">No new orders</p></div>`;
    } catch { $("#ce").textContent = "Can't reach the order server. Retrying…"; }
  }
  qEl.onclick = async e => { const b = e.target.closest("button[data-id]"); if (!b) return; b.disabled = true;
    try { await store.setStatus(b.dataset.id, "done"); last = ""; draw(); } catch { b.disabled = false; $("#ce").textContent = "Could not update the order. Try again."; } };
  window.onstorage = draw; timer = setInterval(draw, 3000); draw();
}
